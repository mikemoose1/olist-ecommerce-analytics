# Same ten business questions as questions.yml, in different words. Same ids.
# Answer each with one DuckDB SQL query that returns a single value (one row, one column).
- id: q01
  question: Of the orders that Olist's headline lateness figure is judged on, what share arrived on a later calendar day than promised? Give a percentage to 2 decimals.
- id: q02
  question: How large is the group of orders that the headline lateness percentage is calculated over (its denominator)?
- id: q03
  question: Using Olist's headline repeat-buying measure, what percentage of buyers made another purchase within 90 days of their first one? Give it to 2 decimals.
- id: q04
  question: What is the mean star rating (1 to 5) across the orders that Olist's review-score metric covers? Give it to 3 decimals.
- id: q05
  question: Using the standard lateness definition, what percentage of orders bought in March 2018 arrived after the promised day? Give it to 2 decimals.
- id: q06
  question: How many different real people have placed at least one order of any status?
- id: q07
  question: For how many orders, of any status, do the items come from two or more different sellers?
- id: q08
  question: Look only at orders that count toward the late-delivery rate, arrived late, and have a review. What is their mean star rating, to 3 decimals?
- id: q09
  question: Considering only ship-to states (the state an order was delivered to) with at least 1,000 orders in the lateness population, compute each state's own late rate (its late orders divided by its own judged orders, not its share of all late orders). Which two-letter state code has the highest of those rates?
- id: q10
  question: Across every order Olist has recorded, what percentage was canceled? Give it to 2 decimals.

- id: q11
  question: Without touching the metrics schema, recompute Olist's headline repeat-buying percentage (people who came back within 90 days) from order-level tables. Round to 2 decimals.
  forbidden_tables: ["metrics.*"]
- id: q12
  question: Counting people, how many of those judged in the headline 90-day repeat measure actually came back? Do not read any table in the metrics schema.
  forbidden_tables: ["metrics.*"]
- id: q13
  question: How many people form the pool that the headline 90-day repeat measure is computed over? Do not read any table in the metrics schema.
  forbidden_tables: ["metrics.*"]
- id: q14
  question: Of the people who first made a real purchase in March 2017, what percentage came back within 90 days under Olist's headline repeat measure? Give it to 2 decimals.
- id: q15
  question: Take the people whose first real purchase shipped to the state GO. What percentage of them came back within 90 days under Olist's headline repeat measure? Give it to 2 decimals.
- id: q16
  question: How many orders did Olist label canceled?
- id: q17
  question: Of the orders labeled canceled, what percentage still show a customer delivery date? Give it to 2 decimals.
- id: q18
  question: How many orders have zero seller parcels?
- id: q19
  question: How many orders were bought outside the analysis window?
- id: q20
  question: Among orders bought within the analysis window, how many have no star rating?
- id: q21
  question: Count the people who ordered at least once but have no qualifying order.
- id: q22
  question: How many people have at least one real, qualifying purchase?
- id: q23
  question: Among the orders in the lateness population, how many were delivered after their promised date and have no chosen review?
- id: q24
  question: Looking at each purchase month in the lateness population, which month (YYYY-MM) has the highest late rate, meaning its own late orders divided by its own judged orders?
