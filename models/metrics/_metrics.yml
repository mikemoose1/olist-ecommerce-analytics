version: 2
models:
  - name: metrics_headline
    description: Every published metric, one row each. repeat_rate_90d is the headline.
    columns:
      - name: metric_name
        data_tests: [unique, not_null]
      - name: value_pct
        data_tests: [not_null]
  - name: metric_late_rate_monthly
    columns:
      - name: year_month
        data_tests:
          - unique
          - dbt_expectations.expect_column_values_to_be_between: {arguments: {min_value: "'2017-01'", max_value: "'2018-08'"}}
  - name: metric_late_rate_orders
    description: The one definition of the late-rate population and of "late" (C1 rule applied).
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - name: is_late
        data_tests: [not_null]
  - name: metric_repeat_rate_90d_people
    description: The one definition of the 90-day repeat population (people eligible for a full 90 days) and of "came back" (C6 rule applied).
    columns:
      - name: customer_unique_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('dim_customer'), field: customer_unique_id}}
      - name: repeated
        data_tests: [not_null]
  - name: metric_late_rate_control_chart
    description: Late rate by purchase month with p-chart (plain and Laney p-prime) 3-sigma limits that move with each month's order count.
    columns:
      - name: year_month
        data_tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_between: {arguments: {min_value: "'2017-01'", max_value: "'2018-08'"}}
      - name: orders
        data_tests: [not_null]
      - name: laney_signal
        data_tests: [not_null]
      - name: laney_sigma_z
        description: How many times larger month-to-month swings are than chance alone explains (1 = chance only).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between: {arguments: {min_value: 1}}
  - name: metric_late_rate_targets
    description: >
      One row. The alarm line (about 8.4%), the safe goal (about 3%: hit in about one month in four, uncertainty about
      2.8-4.4%), the goal line (about 4.4%, the median stable month) and the stretch goal (about 3.4%, the median stable
      month if late seller handoffs ran late no more often than on-time ones: a what-if, not a tested cause) for the
      monthly late rate. Goal and stretch are the same measure on the same stable months, so their gap, about 1 point,
      is the what-if's effect alone. The old stretch value, the 25th percentile of the what-if series (about 2.25%), is retired. The story draws the alarm line, the goal line and the stretch line.
      "Stable" months are the ones that are not extreme (inside the limits, not thin); it does not mean healthy.
      Values are pinned by assert_late_rate_limits_and_goals_hold_their_values and tied to the Python refit by
      assert_late_rate_targets_match_the_python_refit.
    columns:
      - name: alarm_line_late_rate
        data_tests: [not_null]
      - name: safe_goal_late_rate
        data_tests: [not_null]
      - name: goal_late_rate
        description: The median stable month (about 4.4%), the goal line on the story's trend chart.
        data_tests: [not_null]
      - name: stretch_goal_late_rate
        description: The median stable month with late handoffs no later than on-time ones (about 3.4%), the stretch line on the story's trend chart. Like for like with goal_late_rate.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true: {arguments: {expression: "safe_goal_late_rate < alarm_line_late_rate"}}
      - dbt_utils.expression_is_true: {arguments: {expression: "stretch_goal_late_rate < goal_late_rate and goal_late_rate < alarm_line_late_rate"}}
      - dbt_utils.expression_is_true: {arguments: {expression: "stable_months + laney_signal_months + thin_months >= months_in_window"}}
  - name: metric_bad_review_by_days_late
    description: Share of 1-2 star reviews by days after the promised day (negative = early), capped at -30 and +30.
    columns:
      - name: days_past_promise_capped
        data_tests:
          - unique
          - not_null
  - name: metric_review_cost_causal
    description: >
      Extra 1-2 star reviews caused by late delivery, one row per days-late bin; the sum is the review-cost number
      (about 3,110, 26.7% of the 11,635 bad reviews; range about 2,880-3,350 across the six specifications that were
      tried, review_cost_causal/README.md). The effects come from review_cost_causal/analyze.py and are written to
      seeds/review_cost_effects.csv; the test assert_review_cost_causal_reconciles reads
      evidence/review_cost_causal_report.json and checks the dbt total against it.
    columns:
      - name: days_late_bin
        data_tests: [unique, not_null]
      - name: extra_bad_reviews
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true: {arguments: {expression: "reviewed_late_orders = reviewed_late_orders_at_estimation"}}

unit_tests:
  - name: review_cost_bins_and_multiplication
    description: >
      Bin edges are whole days late (1, 2, 3, 4-6, 7-13, 14+); on-time and unreviewed orders never count; each bin's
      extra bad reviews = its reviewed late orders x its effect.
    model: metric_review_cost_causal
    given:
      - input: ref('metric_late_rate_orders')
        rows:
          - {order_id: on_time, is_late: false, review_score: 1}
          - {order_id: d1, is_late: true, review_score: 1}
          - {order_id: d1_unreviewed, is_late: true, review_score: null}
          - {order_id: d3, is_late: true, review_score: 5}
          - {order_id: d4, is_late: true, review_score: 2}
          - {order_id: d6, is_late: true, review_score: 4}
          - {order_id: d7, is_late: true, review_score: 1}
          - {order_id: d13, is_late: true, review_score: 1}
          - {order_id: d14, is_late: true, review_score: 3}
      - input: ref('fct_orders')
        rows:
          - {order_id: on_time, days_past_promise: 0}
          - {order_id: d1, days_past_promise: 1}
          - {order_id: d1_unreviewed, days_past_promise: 1}
          - {order_id: d3, days_past_promise: 3}
          - {order_id: d4, days_past_promise: 4}
          - {order_id: d6, days_past_promise: 6}
          - {order_id: d7, days_past_promise: 7}
          - {order_id: d13, days_past_promise: 13}
          - {order_id: d14, days_past_promise: 14}
      - input: ref('review_cost_effects')
        rows:
          - {days_late_bin: late_d1, min_days_late: 1, max_days_late: 1, effect_on_bad_share: 0.1, effect_se: 0.01, reviewed_late_orders_at_estimation: 1}
          - {days_late_bin: late_d2, min_days_late: 2, max_days_late: 2, effect_on_bad_share: 0.2, effect_se: 0.01, reviewed_late_orders_at_estimation: 0}
          - {days_late_bin: late_d3, min_days_late: 3, max_days_late: 3, effect_on_bad_share: 0.3, effect_se: 0.01, reviewed_late_orders_at_estimation: 1}
          - {days_late_bin: late_d4_6, min_days_late: 4, max_days_late: 6, effect_on_bad_share: 0.5, effect_se: 0.01, reviewed_late_orders_at_estimation: 2}
          - {days_late_bin: late_d7_13, min_days_late: 7, max_days_late: 13, effect_on_bad_share: 0.6, effect_se: 0.01, reviewed_late_orders_at_estimation: 2}
          - {days_late_bin: late_d14p, min_days_late: 14, max_days_late: 9999, effect_on_bad_share: 0.7, effect_se: 0.01, reviewed_late_orders_at_estimation: 1}
    expect:
      rows:
        - {days_late_bin: late_d1, reviewed_late_orders: 1, extra_bad_reviews: 0.1}
        - {days_late_bin: late_d2, reviewed_late_orders: 0, extra_bad_reviews: 0.0}
        - {days_late_bin: late_d3, reviewed_late_orders: 1, extra_bad_reviews: 0.3}
        - {days_late_bin: late_d4_6, reviewed_late_orders: 2, extra_bad_reviews: 1.0}
        - {days_late_bin: late_d7_13, reviewed_late_orders: 2, extra_bad_reviews: 1.2}
        - {days_late_bin: late_d14p, reviewed_late_orders: 1, extra_bad_reviews: 0.7}
